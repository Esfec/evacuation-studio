name: Source package checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            01_研究源码/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest 01_研究源码/tests 02_可视化沙盒/tests -q
      - run: python scripts/verify_package.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node 02_可视化沙盒/tests/narrative.cjs
      - run: node 02_可视化沙盒/tests/scene-effects.cjs
